services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-app
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-app:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CLUSTER_ID: "Mk3C6-3LSoa5X7ALn4t03Q"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-app:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - broker-net
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7.2-alpine
    container_name: redis-broker-app
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass redispass
    networks:
      - broker-net
    volumes:
      - redis-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: keycloak-broker-app
    environment:
      DB_VENDOR: postgres
      DB_ADDR: db_keycloak
      DB_DATABASE: keycloak_db
      DB_USER: keycloak
      DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: Vovan
      KEYCLOAK_ADMIN_PASSWORD: 123321
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db_keycloak:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
    networks:
      - broker-net
    volumes:
      - keycloak-data:/opt/keycloak/data
      - "C:/Users/Asus/IdeaProjects/stock-broker-app/docker/keycloak-data/export/broker-realm-realm.json:/opt/keycloak/data/import/broker-realm-realm.json"
      - "C:/Users/Asus/IdeaProjects/stock-broker-app/docker/keycloak-data/export/broker-realm-users-0.json:/opt/keycloak/data/import/broker-realm-users-0.json"

  db_keycloak:
    image: postgres:13.5
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5434:5432"
    networks:
      - broker-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  broker-net:
    driver: bridge

volumes:
  kafka-data:
  redis-data:
  keycloak-data:
  postgres-data: