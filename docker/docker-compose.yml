services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-app
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CLUSTER_ID: "Mk3C6-3LSoa5X7ALn4t03Q"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-app:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - broker-net

  redis:
    image: redis:7.2-alpine
    container_name: redis-broker-app
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass redispass
    networks:
      - broker-net

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: keycloak-broker-app
    environment:
      KEYCLOAK_ADMIN: Vovan
      KEYCLOAK_ADMIN_PASSWORD: 123321
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    command: start-dev
    networks:
      - broker-net

networks:
  broker-net:
    driver: bridge