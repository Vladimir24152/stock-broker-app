server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - TokenRelay
      routes:
        - id: client-service
          uri: http://client-service:8080
          predicates:
            - Path=/api/clients/**, /api/stocks/**


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak-broker-app:8080/realms/broker-realm

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
