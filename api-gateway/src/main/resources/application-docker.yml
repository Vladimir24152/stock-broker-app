server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        default-filters:
          - TokenRelay=
        routes:
          - id: client-service
            uri: http://client-service:8082
            predicates:
              - Path=/api/clients/**, /api/stocks/**
          - id: balance-service
            uri: http://balance-service:8083
            predicates:
              - Path=/api/balance/**, /api/transactions/**
          - id: stock-adapter
            uri: http://stock-adapter:8084
            predicates:
              - Path=/api/stocks/external/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak-broker-app:8080/realms/broker-realm

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
