server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - TokenRelay
      routes:
        - id: client-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/clients/**, /api/stocks/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        - id: balance-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/balance/**, /api/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        - id: stock-adapter
          uri: http://localhost:8084
          predicates:
            - Path=/api/stocks/external/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/broker-realm
      client:
        registration:
          keycloak:
            client-id: api-gateway
            client-secret: FTVmd9ElGig7lZMbpSDeX6XAMrvb3JEM
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/broker-realm

  data:
    redis:
      host: redis-broker-app
      port: 6379
      password: redispass

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
