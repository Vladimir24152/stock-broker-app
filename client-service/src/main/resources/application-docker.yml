spring:
  datasource:
    url: jdbc:postgresql://db_client_service:5432/client_db
    username: client
    password: client

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  kafka:
    bootstrap-servers: kafka-broker-app:9092

server:
  port: 8080
